<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VU-REC | Login</title>

    <link rel="stylesheet"
          href="../css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 
 
</head> 
 
 
<body class="auth-page"> 
 
 
<div class="auth-container"> 
 
 
    <!-- LEFT SIDE --> 
 
    <div class="auth-brand"> 
 
        <img 
            src="../images/vu-logo.png" 
            alt="Vidyashilp University Logo" 
            class="auth-logo" 
        > 
 
        <h1>VU-REC</h1> 
 
        <h2> 
            Research Ethics Committee Portal 
        </h2> 
 
        <p> 
            Vidyashilp University 
        </p> 
 
        <p class="auth-description"> 
 
            Secure access for Researchers, 
            Reviewers, Member Secretary 
            and Chairperson. 
 
        </p> 
 
    </div> 
 
 
 
    <!-- RIGHT SIDE --> 
 
    <div class="auth-form-section"> 
 
 
        <h2>Welcome Back</h2> 
 
        <p class="auth-subtitle"> 
            Login to continue 
        </p> 
 
 
        <form id="loginForm"> 
 
 
            <!-- EMAIL --> 
 
            <div class="auth-field"> 
 
                <label for="email"> 
                    Email Address 
                </label> 
 
                <input 
                    type="email" 
                    id="email" 
                    placeholder="Enter your email" 
                    required 
                > 
 
            </div> 
 
 
 
            <!-- PASSWORD --> 
 
            <div class="auth-field"> 
 
                <label for="password"> 
                    Password 
                </label> 
 
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Enter your password" 
                    required 
                > 
 
            </div> 
 
 
 
            <!-- ROLE --> 
 
            <div class="auth-field"> 
 
                <label for="role"> 
                    Login As 
                </label> 
 
                <select id="role" required> 
 
                    <option value=""> 
                        Select your role 
                    </option> 
 
                    <option value="Researcher"> 
                        Researcher 
                    </option> 
 
                    <option value="Reviewer"> 
                        Reviewer 
                    </option> 
 
                    <option value="Member Secretary"> 
                        Member Secretary 
                    </option> 
 
                    <option value="Chairperson"> 
                        Chairperson 
                    </option> 
 
                </select> 
 
            </div> 
 
 
 
            <button 
                type="submit" 
                class="auth-button" 
            > 
                Login 
            </button> 
 
 
        </form> 
 
 
        <p class="auth-register-text"> 
 
            Don't have an account? 
 
            <a href="register.html"> 
                Register 
            </a> 
 
        </p> 
 
 
        <p class="auth-home-link"> 
 
            <a href="index.html"> 
                ← Back to Home 
            </a> 
 
        </p> 
 
 
    </div> 
 
 
</div> 
 
 
<script src="../js/login.js"></script> 
 
 
</body> 
 
</html>
