<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Member Secretary Dashboard</title>

    <link rel="stylesheet"
          href="../css/style.css">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body>


<div class="member-secretary-container">


    <div class="member-secretary-header">

        <div>

            <h1>Member Secretary Dashboard</h1>

            <p>
                Research Ethics Committee Portal
            </p>

        </div>


        <button
            type="button"
            id="logoutBtn"
        >
            Logout
        </button>

    </div>



    <div class="member-secretary-card">


        <h2>
            Submitted Applications
        </h2>


        <div class="table-responsive">


            <table class="member-secretary-table">


                <thead>

                    <tr>

                        <th>Application ID</th>

                        <th>Project Title</th>

                        <th>Principal Investigator</th>

                        <th>Department</th>

                        <th>Status</th>

                        <th>Reviewer Decision</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="memberSecretaryTableBody">

                    <tr>

                        <td colspan="7"
                            style="text-align:center;">

                            Loading applications...

                        </td>

                    </tr>

                </tbody>


            </table>


        </div>


    </div>


</div>

<script src="../js/config.js"></script>
<script src="../js/memberSecretaryDashboard.js"></script>


</body>

</html>
